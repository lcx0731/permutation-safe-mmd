[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "permutation-safe-mmd"
version = "0.1.0"
description = "Kernel two-sample testing with selection-aware permutation calibration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
mmd-selection-demo = "safe_mmd.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
